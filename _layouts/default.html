<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    {% if page.image %}
    <meta property="og:image" content="{{ page.image }}">
    <meta property="og:image:alt" content="{{ page.image_alt | default: page.title | escape }}">
    <meta name="twitter:card" content="summary_large_image">
    {% else %}
    <meta name="twitter:card" content="summary">
    {% endif %}
    {% if page.keywords %}<meta name="keywords" content="{{ page.keywords | join: ', ' | escape }}">{% endif %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} feed" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">Meme Video Maker Guides</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Guides</a>
        <a class="nav-cta" href="https://memevideomaker.com/">Open Meme Video Maker</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <p>Independent guides for planning, generating, and reviewing short-form video ideas.</p>
      <a href="https://memevideomaker.com/">Visit Meme Video Maker</a>
    </footer>
  </body>
</html>
